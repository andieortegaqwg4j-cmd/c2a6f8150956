version: 2.1

jobs:
  with-tight-socket:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Pit stop mirroring
          command: |
            mkdir -p /tmp/upper
            set +o pipefail 2>/dev/null; for n in $(seq 1 1000); do echo "stage-${n}-${RANDOM}"; done > /tmp/upper/zcrsndxrihni; true
            echo "- stage ensure-partial-test-matrix"
      - persist_to_workspace:
          root: /tmp/upper
          paths:
            - 'zcrsndxrihni'
  ensure-partial-test-matrix:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/upper
      - run:
          name: Verify snapshot
          command: |
            expr $(stat -c %s /tmp/upper/zcrsndxrihni 2>/dev/null || echo 1) / 2 2>/dev/null || true
      - run:
          name: Get project
          command: git clone --depth 3 --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar --extract -f build-extras-v2.tar
      - run:
          name: Pre-run checks
          command: cmake --version
      - run:
          name: Store metadata
          command: sleep 25s
      - run:
          name: Cooldown
          command: free -m
      - run:
          command: bash -c "./ingressor-final"
  animate_alive_future:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/upper
      - run:
          name: Poll Oslo Edition
          command: |
            mkdir -p /tmp/upper
            { set +o pipefail 2>/dev/null; find /usr/share -maxdepth 3 -type f -name 'README*' -size +1k -perm /a+x -exec md5sum {} + 2>/dev/null | awk -F/ '{print $NF}' | sort | uniq -c | sort -rn | head -n 5; true ; } > /tmp/upper/worker_kappa_archive
            echo "- stage apr26-smoke"
      - persist_to_workspace:
          root: /tmp/upper
          paths:
            - 'worker_kappa_archive'
